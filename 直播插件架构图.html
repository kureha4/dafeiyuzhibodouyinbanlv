<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>抖音直播伴侣互动插件 · 总体架构</title>
<style>
  body { margin: 0; background: #f6f8fb; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  .wrap { width: 900px; margin: 0 auto; padding: 16px 0 8px; }
  svg { display: block; background: #ffffff; border-radius: 12px; box-shadow: 0 2px 10px rgba(30,50,80,.08); }
</style>
</head>
<body>
<div class="wrap">
<svg width="900" height="690" viewBox="0 0 900 690" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a9c6a"/>
    </marker>
    <marker id="aO" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e0863a"/>
    </marker>
    <marker id="aB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3a6fe0"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e2b3c">抖音直播伴侣「互动插件」总体架构（目标形态：AI 虚拟主播）</text>

  <!-- 伴侣 -->
  <rect x="140" y="52" width="620" height="112" rx="10" fill="#eef4ff" stroke="#8fb3e8" stroke-width="1.5"/>
  <text x="450" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4a76">抖音直播伴侣（官方客户端 · 开播画布）</text>
  <text x="450" y="102" text-anchor="middle" font-size="12" fill="#3c5473">画布 / 素材区：显示你推送的透明人物动画、装修弹幕墙、TTS 声音</text>
  <text x="450" y="124" text-anchor="middle" font-size="12" fill="#3c5473">开放数据事件：评论 · 礼物 · 点赞 · 粉丝团变更 · 关注变更</text>
  <text x="450" y="148" text-anchor="middle" font-size="12" fill="#c0392b">⚠ 官方事件不含「进入直播间（进场）」消息 —— 唯一硬缺口，需取舍或另补数据源</text>

  <!-- 管道箭头 -->
  <line x1="330" y1="296" x2="330" y2="168" stroke="#1a9c6a" stroke-width="2.5" marker-end="url(#aG)"/>
  <line x1="570" y1="168" x2="570" y2="296" stroke="#e0863a" stroke-width="2.5" marker-end="url(#aO)"/>
  <text x="250" y="225" text-anchor="end" font-size="12" fill="#1a9c6a">音视频帧 ↑</text>
  <text x="250" y="243" text-anchor="end" font-size="11" fill="#1a9c6a">≤6 个素材通道</text>
  <text x="250" y="261" text-anchor="end" font-size="11" fill="#1a9c6a">单个 ≤1920×1080</text>
  <text x="650" y="225" font-size="12" fill="#e0863a">事件 / 指令 ↓</text>
  <text x="650" y="243" font-size="11" fill="#e0863a">JSON 订阅·发布</text>
  <text x="650" y="261" font-size="11" fill="#e0863a">API 请求·响应</text>

  <!-- 管道标签 -->
  <rect x="352" y="205" width="196" height="62" rx="8" fill="#fff7ec" stroke="#e0863a" stroke-width="1.2"/>
  <text x="450" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5a1e">命名管道</text>
  <text x="450" y="248" text-anchor="middle" font-size="11.5" fill="#8a5a1e">官方 C++ SDK：PipeSDK.dll</text>

  <!-- 插件 exe -->
  <rect x="110" y="300" width="680" height="212" rx="10" fill="#f2fbf6" stroke="#57b98a" stroke-width="1.5"/>
  <text x="450" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e6b46">你的插件程序（exe · 由伴侣启动，命令行传入 pipeName / maxChannels / layoutMode）</text>

  <text x="134" y="354" font-size="12" fill="#245c40">① 透明人物动画：FFmpeg 解码带 Alpha 视频（WebM 等）→ 循环推送 RGBA 帧 → 素材通道 0</text>
  <text x="134" y="384" font-size="12" fill="#245c40">② 装修弹幕墙：自绘渲染（HTML/Canvas/图形库）→ 推送 RGBA 帧 → 素材通道 1（完全自定义样式）</text>
  <text x="134" y="414" font-size="12" fill="#245c40">③ 互动事件中心：解析 OPEN_LIVE_DATA，礼物 sec_gift_id 经 getOpenGiftPools 映射出礼物名</text>
  <text x="134" y="444" font-size="12" fill="#245c40">④ AI 对话：弹幕 / 送礼等事件 → 组装提示词 → 调用大模型生成回复文本</text>
  <text x="134" y="474" font-size="12" fill="#245c40">⑤ TTS 合成：回复文本 → PCM 音频帧 → 推送素材通道（混入直播）或本机播放，同时驱动人物口型/动作</text>
  <text x="134" y="498" font-size="11" fill="#5c7a6b">SDK 官方示例为 C++17（VS2019+）；Electron 方案文档标注"待补充"，exe 亦可内嵌其他语言的业务进程</text>

  <!-- 外部服务 -->
  <line x1="450" y1="512" x2="450" y2="562" stroke="#3a6fe0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aB)"/>
  <rect x="300" y="566" width="300" height="60" rx="10" fill="#f0f3ff" stroke="#7a95e0" stroke-width="1.4"/>
  <text x="450" y="590" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a76">外部服务（HTTPS）</text>
  <text x="450" y="612" text-anchor="middle" font-size="11.5" fill="#3c5473">大模型 API · TTS 服务（可选本地部署降低延迟）</text>

  <!-- 底部备注 -->
  <text x="450" y="656" text-anchor="middle" font-size="12" fill="#5a6b80">上线路径：开放平台创建「互动插件（exe 型）」→ 申请开放数据能力 → 调试伴侣包本地验证 → 上传包体审核 → 发布</text>
  <text x="450" y="678" text-anchor="middle" font-size="12" fill="#5a6b80">本地调试可先用官方调试版伴侣包 + 调试面板「模拟互动消息」按钮，全链路无需真实开播</text>
</svg>
</div>
</body>
</html>
